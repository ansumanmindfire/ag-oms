[project]
name = "ag-oms"
version = "0.1.0"
description = "Agentic Order Management System built with FastAPI, LangChain, Qdrant, SQLite, and Streamlit"
authors = [
    {name = "Ansuman", email = "ansumanp@mindfiresolutions.com"}
]
requires-python = ">=3.10,<4.0.0"
dependencies = [
    "fastapi (>=0.110.0,<1.0.0)",
    "uvicorn (>=0.28.0,<1.0.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "python-multipart (>=0.0.9,<1.0.0)",
    "langchain (>=1.3.18,<2.0.0)",
    "langchain-google-genai (>=4.3.7,<5.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "redmail (>=0.6.0,<0.7.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "langchain-openai (>=1.6.2,<2.0.0)",
    "qdrant-client (>=1.19.0,<2.0.0)",
    "fastembed (>=0.8.0,<0.9.0)",
    "pypdf (>=6.18.0,<7.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "redis (>=5.0.0)",
    "streamlit (>=1.62.0,<2.0.0)",
    "pdfplumber (>=0.11.10,<0.12.0)"
]


[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

