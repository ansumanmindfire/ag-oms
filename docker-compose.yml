services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ag_oms_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
    volumes:
      - ./app:/code/app
      - sqlite_data:/code/data
      - ./logs:/code/logs
    depends_on:
      - qdrant
      - redis
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ag_oms_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: always

  redis:
    image: redis:alpine
    container_name: ag_oms_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
    restart: always

  db-viewer:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: ag_oms_db_viewer
    ports:
      - "8080:8080"
    volumes:
      - sqlite_data:/data:ro
    command: -r -H 0.0.0.0 -p 8080 /data/db.sqlite
    depends_on:
      - api
    restart: always

volumes:
  sqlite_data:
